<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Miguel Fabian Castro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <h1>Contact</h1>
        <p>Send a message to discuss projects, collaboration, or future opportunities.</p>
      </div>

      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="skills.html">Skills</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <div class="section-header">
          <h2>Get in touch</h2>
          <span>Reach out with questions, ideas, or project requests.</span>
        </div>
        <form class="contact-form" action="#" method="post">
          <label>
            Name
            <input type="text" name="name" placeholder="Your name" />
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="your.email@example.com" />
          </label>
          <label>
            Message
            <textarea name="message" placeholder="Tell me about your project or question"></textarea>
          </label>
          <button type="submit">Send message</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Miguel Fabian Castro. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
